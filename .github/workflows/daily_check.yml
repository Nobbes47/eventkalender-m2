name: Tägliche Metin2 Events auslesen

on:
  schedule:
    # Führt das Skript täglich um 08:00 Uhr UTC (09:00 oder 10:00 Uhr deutscher Zeit) aus
    - cron: '0 8 * * *'
  workflow_dispatch: # Erlaubt es, das Skript jederzeit manuell zu starten

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    - name: Python einrichten
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Abhängigkeiten installieren
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Skript ausführen
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python bot.py
